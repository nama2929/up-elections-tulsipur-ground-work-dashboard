name: Verify Tulsipur GP Portal
on:
  push:
    branches:
      - feature/gram-panchayat-report-viewer
  pull_request:
    branches:
      - main
jobs:
  python-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: python -m pip install -r requirements.txt
      - name: Check Python syntax
        run: python -m py_compile app.py gp_ui.py report_engine.py report_store.py
      - name: Test DOCX extraction
        run: python test_report_engine.py
